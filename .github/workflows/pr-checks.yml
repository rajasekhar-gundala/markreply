name: PR Code Quality Checks

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Format, Lint, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for Secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "markreply-cache"

      - name: Check Formatting
        run: cargo fmt --all -- --check
        
      - name: Run Clippy (Code Linter)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test --all-targets --all-features
      
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Security Audit (SAST)
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0104