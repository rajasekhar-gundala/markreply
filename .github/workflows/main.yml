name: Publish Docker
on:
  workflow_run:
    workflows: ["PR Code Quality Checks"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch: # Allows you to manually click "Run workflow" if needed

jobs:
  github-repo:
    # Only run if the previous PR checks succeeded, or if triggered manually
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.PERSONAL_TOKEN }}

    - name: Build Docker Image locally
      run: docker build -t ghcr.io/rajasekhar-gundala/markreply:latest .

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ghcr.io/rajasekhar-gundala/markreply:latest'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'

    - name: Start Container for DAST & Verify Readiness
      run: |
        docker run -d --network=host \
          -e HOST=0.0.0.0 \
          -e PORT=3000 \
          --name markreply-dast \
          ghcr.io/rajasekhar-gundala/markreply:latest

        echo "Waiting for markreply-dast to listen on http://localhost:3000..."
        for i in $(seq 1 15); do
          if [ "$(docker inspect -f '{{.State.Running}}' markreply-dast)" != "true" ]; then
            echo "❌ Container exited unexpectedly. Logs:"
            docker logs markreply-dast
            exit 1
          fi

          if curl -sSf http://localhost:3000 > /dev/null 2>&1; then
            echo "✅ Server is up on port 3000!"
            exit 0
          fi
          sleep 1
        done

        echo "❌ Timeout reached! Printing container logs:"
        docker logs markreply-dast
        echo "Printing listening ports inside runner:"
        ss -tulpn || netstat -an || true
        exit 1

    - name: OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.15.0
      with:
        target: 'http://localhost:3000'
        fail_action: false
        allow_issue_writing: false

    - name: Push to Registry
      run: docker push ghcr.io/rajasekhar-gundala/markreply:latest

    - name: Clean up DAST Container
      if: always()
      run: docker rm -f markreply-dast